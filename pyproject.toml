[project]
name = "ds-eda-project-template"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "contextily>=1.7.1",
    "geopandas>=1.2.0",
    "missingno>=0.5.2",
    "plotly>=6.8.0",
    "psycopg2-binary>=2.9.12",
    "pyproj>=3.8.0",
    "python-dotenv>=1.2.2",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.50",
    "staticmap>=0.5.7",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "nbformat>=5.10.4",
]
